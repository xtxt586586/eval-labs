name: eval-labs-ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r backend/requirements.txt
      - run: pytest backend/tests -q | tee backend-test.log
        env:
          RUN_EVAL_ON_CREATE: "false"
          SEED_ON_STARTUP: "true"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-log
          path: backend-test.log

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm --prefix frontend run build | tee frontend-build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-build-log
          path: frontend-build.log
